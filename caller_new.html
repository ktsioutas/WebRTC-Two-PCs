<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC Caller</title>
  <style>
    video {
      width: 45%;
      margin: 10px;
    }
  </style>
</head>
<body>
  <h1>WebRTC Caller</h1>
  <video id="localVideo" autoplay playsinline muted></video>
  <video id="remoteVideo" autoplay playsinline></video>
  <button onclick="downloadLogs()">Download Logs</button>
  <button onclick="makeCall()">Call</button>
  <script>
    const signalingServer = new WebSocket('ws://192.168.20.114:8080'); // Update to your signaling server IP

    const config = {
      iceServers: [{ urls: "stun:stun.l.google.com:19302" }] // Public STUN server

    };
    const peerConnection = new RTCPeerConnection(config);
    signalingServer.onmessage = async (message) => {
      const data = JSON.parse(message.data);
      console.log('init received message:', data);

      if (data.type === 'answer') {
          console.log('Initiator received SDP answer:', data.answer);

          //try {
            const remoteDesc = new RTCSessionDescription(data.answer);
            await peerConnection.setRemoteDescription(remoteDesc);
            //await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
          console.log('Remote description set successfully.');



          console.log('Initiator set remote description.');

        } else if (data.type === 'candidate') {
          console.log('Initiator received ICE candidate:', data.candidate);
          try {
            await peerConnection.addIceCandidate(data.candidate);

             // await peerConnection.addIceCandidate(data.iceCandidate);
          } catch (e) {
            console.error('Error adding received ice candidate', e);

        }
      }
    };


    peerConnection.addEventListener('icecandidate', event => {
      if (event.candidate) {
        console.log('Caller sending ICE candidate:', event.candidate);
        signalingServer.send(JSON.stringify({ type: 'candidate', candidate: event.candidate }));      }
    });

    let localStream;

    // Get local media stream
    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
      .then((stream) => {
        localStream = stream;
        document.getElementById('localVideo').srcObject = stream;

        // Add local stream tracks to the peer connection
        stream.getTracks().forEach((track) => peerConnection.addTrack(track, stream));
      })
      .catch((error) => console.error('Error accessing media devices:', error));

    // Handle incoming remote stream
    peerConnection.ontrack = (event) => {
      document.getElementById('remoteVideo').srcObject = event.streams[0];
    };





    // Create an offer when the signaling server connection is open
   
    async function makeCall() {
      
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        signalingServer.send(JSON.stringify({ type: 'offer', offer}));
        console.log('Initiator created SDP offer:', offer);

    }



  </script>
</body>
</html>
