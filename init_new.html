<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC Init</title>
  <style>
    video {
      width: 45%;
      margin: 10px;
    }
  </style>
</head>
<body>
  <h1>WebRTC Init</h1>
  <video id="localVideo" autoplay playsinline muted></video>
  <video id="remoteVideo" autoplay playsinline></video>
  <script>
    const signalingServer = new WebSocket('ws://192.168.20.114:8080'); // Update to match your signaling server IP

   const config = {
      iceServers: [{ urls: "stun:stun.l.google.com:19302" }] // Public STUN server

    };

    const peerConnection = new RTCPeerConnection(config);
    // Handle ICE candidates
    peerConnection.addEventListener('icecandidate', event => {
      if (event.candidate) {
        console.log('Caller sending ICE candidate:', event.candidate);
        signalingServer.send(JSON.stringify({ type: 'candidate', candidate: event.candidate }));      }
    });


    
    // Listen for connectionstatechange on the local RTCPeerConnection
    peerConnection.addEventListener('connectionstatechange', event => {
        if (peerConnection.connectionState === 'connected') {
            // Peers connected!
        }
    });


    let localStream;
    // Get local media stream
    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
      .then((stream) => {
        localStream = stream;
        document.getElementById('localVideo').srcObject = stream;

        // Add local stream tracks to the peer connection
        stream.getTracks().forEach((track) => peerConnection.addTrack(track, stream));
      })
      .catch((error) => console.error('Error accessing media devices:', error));

    // Handle incoming remote stream
    peerConnection.ontrack = (event) => {
      console.log('Received remote stream');
      document.getElementById('remoteVideo').srcObject = event.streams[0];
    };


    // Handle messages from the signaling server
    signalingServer.onmessage = async (message) => {
      const data = JSON.parse(message.data);
      console.log('Caller received message:', data);


      if (data.type === 'offer') {

        console.log('Caller received SDP offer:', data.offer);
        //await setRemoteDescription(new RTCSessionDescription(data.offer));
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
        console.log('Caller set remote description.');   
        
        const answer = await peerConnection.createAnswer();
        console.log('Caller created SDP answer:', answer);
        await peerConnection.setLocalDescription(answer);

        signalingServer.send(JSON.stringify({ type: 'answer', answer}));
        console.log('Caller sent SDP answer.');

      } else if (data.type === 'candidate') {
        console.log('Caller received ICE candidate:', data.candidate);

        try {
           await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));

            //await peerConnection.addIceCandidate(data.iceCandidate);
        } catch (e) {
            console.error('Error adding received ice candidate', e);
        }
        console.log('Caller added ICE candidate.');
      }
    };



  </script>
</body>
</html>
